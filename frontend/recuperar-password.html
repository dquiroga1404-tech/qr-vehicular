<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - QR Vehicular</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-logo { text-align: center; font-size: 3em; margin-bottom: 10px; }
        .auth-container h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 1.8em;
        }
        .auth-subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 0.95em;
            line-height: 1.5;
        }
        .auth-container .form-group { margin-bottom: 20px; }
        .auth-container .btn { width: 100%; padding: 14px; font-size: 16px; }
        .auth-links { text-align: center; margin-top: 25px; font-size: 0.9em; }
        .auth-links a { color: #3498db; text-decoration: none; font-weight: 600; }
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
            display: none;
        }
        .alert-error { background: #fadbd8; color: #c0392b; border-left: 4px solid #e74c3c; }
        .alert-success { background: #d5f4e6; color: #27ae60; border-left: 4px solid #27ae60; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">🔐</div>
        <h1>Recuperar Contraseña</h1>
        <p class="auth-subtitle">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
        
        <div id="alert" class="alert"></div>
        
        <form id="recuperarForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="tu@email.com" autocomplete="email">
            </div>
            <button type="submit" class="btn btn-primary" id="btnEnviar">Enviar Enlace</button>
        </form>
        
        <div class="auth-links">
            <p><a href="login.html">← Volver al inicio de sesión</a></p>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://qr-vehicular.onrender.com/api';
        
        function mostrarAlerta(mensaje, tipo = 'error') {
            const alert = document.getElementById('alert');
            alert.textContent = mensaje;
            alert.className = 'alert alert-' + tipo;
            alert.style.display = 'block';
        }
        
        document.getElementById('recuperarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btnEnviar');
            const email = document.getElementById('email').value.trim();
            
            btn.disabled = true;
            btn.textContent = 'Enviando...';
            
            try {
                const response = await fetch(`${API_URL}/auth/recuperar-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    mostrarAlerta(result.message, 'success');
                    document.getElementById('recuperarForm').reset();
                } else {
                    mostrarAlerta(result.error || 'Error al procesar solicitud');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error de conexión con el servidor');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enviar Enlace';
            }
        });
    </script>
</body>
</html>
