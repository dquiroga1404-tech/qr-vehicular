<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - QR Vehicular</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-logo { text-align: center; font-size: 3em; margin-bottom: 10px; }
        .auth-container h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 1.8em;
        }
        .auth-subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        .auth-container .form-group { margin-bottom: 20px; }
        .auth-container .btn { width: 100%; padding: 14px; font-size: 16px; }
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
            display: none;
        }
        .alert-error { background: #fadbd8; color: #c0392b; border-left: 4px solid #e74c3c; }
        .alert-success { background: #d5f4e6; color: #27ae60; border-left: 4px solid #27ae60; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">🔑</div>
        <h1>Nueva Contraseña</h1>
        <p class="auth-subtitle">Ingresa tu nueva contraseña</p>
        
        <div id="alert" class="alert"></div>
        
        <form id="resetForm">
            <div class="form-group">
                <label for="password">Nueva Contraseña</label>
                <input type="password" id="password" required placeholder="Mínimo 6 caracteres" minlength="6">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" required placeholder="Repite la contraseña" minlength="6">
            </div>
            <button type="submit" class="btn btn-primary" id="btnReset">Restablecer Contraseña</button>
        </form>
    </div>
    
    <script>
        const API_URL = 'https://qr-vehicular.onrender.com/api';

        console.log('=== DEBUG reset-password ===');
        console.log('URL completa:', window.location.href);
        console.log('Search (query string):', window.location.search);
        console.log('Hash:', window.location.hash);

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        console.log('Token extraído:', token);
        
        function mostrarAlerta(mensaje, tipo = 'error') {
            const alert = document.getElementById('alert');
            alert.textContent = mensaje;
            alert.className = 'alert alert-' + tipo;
            alert.style.display = 'block';
        }
        
        // Si no hay token en la URL, mostrar error
        if (!token) {
            mostrarAlerta('Token no proporcionado. Solicita un nuevo enlace de recuperación.');
            document.getElementById('resetForm').style.display = 'none';
        }
        
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btnReset');
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                mostrarAlerta('Las contraseñas no coinciden');
                return;
            }
            
            if (password.length < 6) {
                mostrarAlerta('La contraseña debe tener al menos 6 caracteres');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Actualizando...';
            
            try {
                const response = await fetch(`${API_URL}/auth/restablecer-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, nuevaPassword: password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    mostrarAlerta('¡Contraseña actualizada! Redirigiendo al login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    mostrarAlerta(result.error || 'Error al restablecer contraseña');
                    btn.disabled = false;
                    btn.textContent = 'Restablecer Contraseña';
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error de conexión con el servidor');
                btn.disabled = false;
                btn.textContent = 'Restablecer Contraseña';
            }
        });
    </script>
</body>
</html>
