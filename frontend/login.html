<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - QR Vehicular</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-logo {
            text-align: center;
            font-size: 3em;
            margin-bottom: 10px;
        }
        .auth-container h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 1.8em;
        }
        .auth-subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        .auth-container .form-group {
            margin-bottom: 20px;
        }
        .auth-container .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
        }
        .auth-links {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9em;
        }
        .auth-links a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }
        .auth-links p {
            margin: 8px 0;
            color: #7f8c8d;
        }
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
            display: none;
        }
        .alert-error {
            background: #fadbd8;
            color: #c0392b;
            border-left: 4px solid #e74c3c;
        }
        .alert-success {
            background: #d5f4e6;
            color: #27ae60;
            border-left: 4px solid #27ae60;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">🚗</div>
        <h1>QR Vehicular</h1>
        <p class="auth-subtitle">Sistema de Gestión Vehicular</p>
        
        <div id="alert" class="alert"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="tu@email.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" id="btnLogin">Iniciar Sesión</button>
        </form>
        
        <div class="auth-links">
            <p><a href="recuperar-password.html">¿Olvidaste tu contraseña?</a></p>
            <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://qr-vehicular.onrender.com/api';
        
        // Si ya hay sesión activa, redirigir
        if (localStorage.getItem('token')) {
            window.location.replace('index.html');
        }
        
        function mostrarAlerta(mensaje, tipo = 'error') {
            const alert = document.getElementById('alert');
            alert.textContent = mensaje;
            alert.className = 'alert alert-' + tipo;
            alert.style.display = 'block';
            setTimeout(() => { alert.style.display = 'none'; }, 5000);
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btnLogin');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            btn.disabled = true;
            btn.textContent = 'Iniciando sesión...';
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
             localStorage.setItem('token', result.data.token);
             localStorage.setItem('usuario', JSON.stringify(result.data.usuario));
             mostrarAlerta('¡Bienvenido! Redirigiendo...', 'success');
            setTimeout(() => {
              window.location.replace('index.html');  // ← Cambio aquí
    }, 800);
} else {
    mostrarAlerta(result.error || 'Credenciales inválidas');
    btn.disabled = false;
    btn.textContent = 'Iniciar Sesión';
}
        });
    </script>
</body>
</html>
