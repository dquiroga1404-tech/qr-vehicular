<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - QR Vehicular</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-logo { text-align: center; font-size: 3em; margin-bottom: 10px; }
        .auth-container h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 1.8em;
        }
        .auth-subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        .auth-container .form-group { margin-bottom: 20px; }
        .auth-container .btn { width: 100%; padding: 14px; font-size: 16px; }
        .auth-links { text-align: center; margin-top: 25px; font-size: 0.9em; }
        .auth-links a { color: #3498db; text-decoration: none; font-weight: 600; }
        .auth-links p { margin: 8px 0; color: #7f8c8d; }
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
            display: none;
        }
        .alert-error { background: #fadbd8; color: #c0392b; border-left: 4px solid #e74c3c; }
        .alert-success { background: #d5f4e6; color: #27ae60; border-left: 4px solid #27ae60; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">🚗</div>
        <h1>Crear Cuenta</h1>
        <p class="auth-subtitle">Regístrate en QR Vehicular</p>
        
        <div id="alert" class="alert"></div>
        
        <form id="registroForm">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" required placeholder="Tu nombre completo">
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="Mínimo 6 caracteres" minlength="6">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" required placeholder="Repite la contraseña" minlength="6">
            </div>
            <button type="submit" class="btn btn-primary" id="btnRegistro">Registrarse</button>
        </form>
        
        <div class="auth-links">
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a></p>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:3000/api';
        
        function mostrarAlerta(mensaje, tipo = 'error') {
            const alert = document.getElementById('alert');
            alert.textContent = mensaje;
            alert.className = 'alert alert-' + tipo;
            alert.style.display = 'block';
            if (tipo === 'error') {
                setTimeout(() => { alert.style.display = 'none'; }, 5000);
            }
        }
        
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btnRegistro');
            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                mostrarAlerta('Las contraseñas no coinciden');
                return;
            }
            
            if (password.length < 6) {
                mostrarAlerta('La contraseña debe tener al menos 6 caracteres');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Registrando...';
            
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    mostrarAlerta('¡Registro exitoso! Redirigiendo al login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    mostrarAlerta(result.error || 'Error al registrar');
                    btn.disabled = false;
                    btn.textContent = 'Registrarse';
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error de conexión con el servidor');
                btn.disabled = false;
                btn.textContent = 'Registrarse';
            }
        });
    </script>
</body>
</html>
